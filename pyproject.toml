[project]
name = "secagent-riskops"
version = "0.2.0"
description = "Reduces raw security alerts to a small set of incidents, with reproducible accuracy and miss-rate reporting"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "pydantic>=2.6",
    "uvicorn>=0.29",
    "maxminddb>=3.1.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

# The MVP walking skeleton persists to SQLite (stdlib) so `pytest` runs with no
# external database. The production target remains PostgreSQL behind the same
# Repository interface (see backend/app/storage/repository.py).

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
