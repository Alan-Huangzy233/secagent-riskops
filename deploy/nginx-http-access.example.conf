# EXAMPLE ONLY: review and include inside nginx's http {} context.
# This version assumes real_ip_header/realip rewriting is NOT enabled.
# If it is enabled, use $realip_remote_addr for client_ip to retain the original
# connection peer, after verifying the realip module/configuration.
# Never replace client_ip with an unvalidated request header.

# Preserve the encoded path for traversal detection, without query arguments.
map $request_uri $riskops_request_path {
    ~^(?<riskops_path_without_args>[^?]*) $riskops_path_without_args;
    default "";
}

log_format riskops_http escape=json
    '{"timestamp":"$time_iso8601",'
    '"client_ip":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$riskops_request_path",'
    '"status":$status}';

# Enable on ONE intended server {} after checking permissions/rotation/capacity:
# access_log /var/log/nginx/riskops-access.jsonl riskops_http;
# Do not log cookies, authorization headers or request bodies in this format.
