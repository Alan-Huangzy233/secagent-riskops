name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Run end-to-end demo (smoke)
        run: PYTHONPATH=backend python -m app.demo

  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Rebuild the 7-day dataset and verify its manifest
        run: python -m app.evaluation.synthetic --days 7 --out runtime-data/eval/synthetic-7d --verify examples/synthetic-sshd/manifest-7d.json

      - name: Reproduce the published results byte for byte
        run: |
          python -m app.evaluation.run --data runtime-data/eval/synthetic-7d --out docs/eval/results-synthetic-7d.json
          git diff --exit-code docs/eval/results-synthetic-7d.json

