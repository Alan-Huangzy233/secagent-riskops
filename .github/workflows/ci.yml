name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Run end-to-end demo (smoke)
        run: PYTHONPATH=backend python -m app.demo

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker compose build

      - name: Run the demo in the container
        run: docker compose run --rm demo

      - name: API becomes healthy
        run: |
          docker compose up --detach --wait api
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error --request POST http://127.0.0.1:8000/flows/run

      - name: Stop
        if: always()
        run: docker compose down

